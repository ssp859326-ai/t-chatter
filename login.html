<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Sign in · T-chatter</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f6f3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#15221f;padding:20px}.card{width:min(100%,420px);background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px #123b2a12}.brand{display:flex;align-items:center;gap:12px;color:#075e54;font-weight:850;font-size:25px}.mark{width:42px;height:42px;background:#075e54;color:#fff;border-radius:13px;display:grid;place-items:center}.tag{font-size:11px;color:#7c8984;letter-spacing:1.3px;margin-top:3px}h1{font-size:25px;margin:30px 0 8px}p{font-size:14px;color:#6b7974;line-height:1.55}.field{width:100%;padding:14px;border:1px solid #dce5e0;border-radius:12px;font:inherit;margin-top:12px;outline-color:#075e54}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#075e54;color:white;font:inherit;font-weight:750;margin-top:14px;cursor:pointer}.link{border:0;background:none;color:#075e54;font:inherit;font-size:13px;margin-top:15px;cursor:pointer}.notice{background:#f0f7f3;padding:12px;border-radius:10px;font-size:12px;color:#62736a;margin-top:18px}.back{display:block;text-align:center;margin-top:18px;color:#075e54;text-decoration:none;font-size:13px}.status{font-size:13px;min-height:20px;color:#075e54;margin-top:12px;overflow-wrap:anywhere}
</style></head><body><main class="card"><div class="brand"><div class="mark">T</div><div>T-chatter<div class="tag">PRIVATE. SIMPLE. YOURS.</div></div></div>
<h1 id="heading">Welcome to T-chatter</h1><p id="intro">Create an account or sign in with your email address and password. No Google login or SMS required.</p>
<form id="authForm"><input class="field" id="email" type="email" autocomplete="email" placeholder="Email address" required><input class="field" id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Password (at least 8 characters)" required><button class="btn" id="submitBtn" type="submit">Sign in</button></form>
<button class="link" id="toggleMode" type="button">New to T-chatter? Create account</button><br><button class="link" id="forgotBtn" type="button">Forgot password?</button>
<div id="status" class="status" role="status" aria-live="polite"></div><div class="notice">Use a valid email address. If email confirmation is enabled, check your inbox after creating your account.</div><a class="back" href="index.html">← Back to T-chatter</a></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {supabaseConfig} from "./supabase-config.js";
const sb=createClient(supabaseConfig.url,supabaseConfig.publishableKey);
const form=document.getElementById("authForm"),email=document.getElementById("email"),password=document.getElementById("password"),status=document.getElementById("status");
const heading=document.getElementById("heading"),intro=document.getElementById("intro"),submit=document.getElementById("submitBtn"),toggle=document.getElementById("toggleMode");
let mode="signin";
function setMode(next){mode=next;const signup=mode==="signup";heading.textContent=signup?"Create your account":"Welcome back";intro.textContent=signup?"Create a T-chatter account using your email and a password.":"Sign in to continue to your T-chatter chats.";submit.textContent=signup?"Create account":"Sign in";toggle.textContent=signup?"Already have an account? Sign in":"New to T-chatter? Create account";password.autocomplete=signup?"new-password":"current-password";status.textContent="";}
toggle.addEventListener("click",()=>setMode(mode==="signin"?"signup":"signin"));
form.addEventListener("submit",async event=>{event.preventDefault();submit.disabled=true;status.textContent=mode==="signup"?"Creating account…":"Signing in…";try{const address=email.value.trim().toLowerCase();const result=mode==="signup"?await sb.auth.signUp({email:address,password:password.value,options:{emailRedirectTo:location.origin+"/index.html"}}):await sb.auth.signInWithPassword({email:address,password:password.value});if(result.error)throw result.error;if(mode==="signup"&&!result.data.session){status.textContent="Account created. Check your email to confirm, then return here and sign in.";return;}location.href="index.html";}catch(error){status.textContent=error.message||"Authentication failed.";}finally{submit.disabled=false;}});
document.getElementById("forgotBtn").addEventListener("click",async()=>{const address=email.value.trim().toLowerCase();if(!address){status.textContent="Enter your email address first.";return;}status.textContent="Sending password reset email…";const {error}=await sb.auth.resetPasswordForEmail(address,{redirectTo:location.origin+"/login.html"});status.textContent=error?error.message:"If this email has an account, a password reset link has been sent.";});
setMode("signin");
sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    setTimeout(async () => {
      const nextPassword = prompt("Enter your new password (at least 8 characters):");
      if (!nextPassword || nextPassword.length < 8) {
        status.textContent = "Password unchanged. Request another reset link if needed.";
        return;
      }
      const { error } = await sb.auth.updateUser({ password: nextPassword });
      status.textContent = error ? error.message : "Password updated. You can now sign in with your new password.";
      if (!error) await sb.auth.signOut();
    }, 0);
  }
});
</script></body></html>
