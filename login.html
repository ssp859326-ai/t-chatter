<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><title>Sign in · T-chatter</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f6f3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#15221f;padding:20px}.card{width:min(100%,420px);background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px #123b2a12}.brand{display:flex;align-items:center;gap:12px;color:#075e54;font-weight:850;font-size:25px}.mark{width:42px;height:42px;background:#075e54;color:#fff;border-radius:13px;display:grid;place-items:center}.tag{font-size:11px;color:#7c8984;letter-spacing:1.3px;margin-top:3px}h1{font-size:25px;margin:30px 0 8px}p{font-size:14px;color:#6b7974;line-height:1.55}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#075e54;color:white;font:inherit;font-weight:750;margin-top:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}.google{background:#fff;color:#202124;border:1px solid #dadce0}.notice{background:#f0f7f3;padding:12px;border-radius:10px;font-size:12px;color:#62736a;margin-top:18px}.back{display:block;text-align:center;margin-top:18px;color:#075e54;text-decoration:none;font-size:13px}.status{font-size:13px;min-height:20px;color:#075e54;margin-top:12px;overflow-wrap:anywhere}</style></head><body><main class="card"><div class="brand"><div class="mark">T</div><div>T-chatter<div class="tag">PRIVATE. SIMPLE. YOURS.</div></div></div><h1>Continue with Google</h1><p>Sign in securely with your Google account. No SMS or phone balance required.</p><button class="btn google" id="googleSignIn">Continue with Google</button><div id="status" class="status" role="status" aria-live="polite"></div><div class="notice">Google sign-in uses Supabase Auth. Configure Google OAuth in your Supabase project before signing in.</div><a class="back" href="index.html">← Back to T-chatter</a></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {supabaseConfig} from "./supabase-config.js";
const status=document.getElementById("status"),button=document.getElementById("googleSignIn");
const configured=!!supabaseConfig?.url&&!!supabaseConfig?.publishableKey&&!String(supabaseConfig.publishableKey).includes("YOUR_");
button.onclick=async()=>{if(!configured){status.textContent="Setup needed: add Supabase project URL and publishable key to supabase-config.js.";return;}button.disabled=true;status.textContent="Redirecting to Google…";try{const sb=createClient(supabaseConfig.url,supabaseConfig.publishableKey);const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin+"/index.html"}});if(error)throw error;}catch(e){status.textContent=e.message||"Google sign-in failed. Check Supabase Auth provider settings.";}finally{button.disabled=false;}};
</script></body></html>
