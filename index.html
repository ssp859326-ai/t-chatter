<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><meta name="description" content="T-chatter — private conversations, made simple.">
<title>T-chatter</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"></head>
<body><div class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark">T</div><div><strong>T-chatter</strong><small>Private conversations</small></div></div><div class="top-actions"><a href="login.html" style="color:white;text-decoration:none;font-size:12px;font-weight:700;padding:10px">Sign in</a><button aria-label="Search" id="searchBtn">⌕</button><button aria-label="Sign out" id="menuBtn">⋮</button></div></header>
<nav class="tabs" aria-label="Main navigation"><button class="tab active" data-tab="chats">Chats</button><button class="tab" data-tab="updates">Updates</button><button class="tab" data-tab="calls">Calls</button></nav>
<main><section class="list-view" id="listView"><div class="search-wrap"><span>⌕</span><input id="searchInput" placeholder="Search chats" aria-label="Search chats"></div><div class="section-label" id="sectionLabel">PRIVATE CHATS</div><div id="chatList" class="chat-list"></div><div class="demo-note">Private messages are stored in your configured Firebase project.</div></section>
<section class="conversation hidden" id="conversation"><div class="conversation-head"><button class="back" id="backBtn" aria-label="Back">‹</button><div class="avatar" id="chatAvatar">T</div><div class="person"><strong id="chatName">Chat</strong><small>Private chat</small></div><button class="head-icon" aria-label="Voice call" title="Coming soon">☎</button><button class="head-icon" aria-label="Video call" title="Coming soon">▣</button></div><div class="messages" id="messages"></div><div class="composer"><button class="plus" aria-label="Attachment" title="Coming soon">＋</button><input id="messageInput" placeholder="Message" aria-label="Message"><button class="emoji" aria-label="Emoji">☺</button><button class="send" id="sendBtn" aria-label="Send">➤</button></div></section></main>
<button class="new-chat" id="newChat" aria-label="New chat" title="Start a chat">＋</button><footer>Chats · Updates · Calls · <a href="privacy.html" style="color:#075e54">Privacy</a></footer></div>
<script type="module" src="app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script></body></html>
